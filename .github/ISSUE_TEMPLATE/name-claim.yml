name: 🪪 Name claim / verification
description: Claim a protected scope name, request a verified badge, or dispute squatting/impersonation.
title: "name: "
labels: ["name-claim"]
body:
  - type: markdown
    attributes:
      value: |
        See the [Name & verification policy](https://rulepack.lyrra.net/docs/legal/name-policy).
        For anything you can't share publicly, email contact@rulepack.lyrra.net instead.
  - type: input
    id: scope
    attributes:
      label: Scope name
      description: The @scope this is about.
      placeholder: "@react"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What are you requesting?
      options:
        - Claim a protected name
        - Verify a scope I own
        - Dispute squatting / impersonation
    validations:
      required: true
  - type: input
    id: who
    attributes:
      label: Who do you represent?
      description: The person, project, or organization behind the name.
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: How can we verify it?
      description: e.g. you own the matching GitHub org, control the official domain/repo, or another public proof.
    validations:
      required: true
